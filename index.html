<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="refresh" content="0; url=html/index.html">
    <meta name="theme-color" content="#121212">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <title>What New Songs</title>
    <script>
        // Immediately redirect to html/index.html preserving any query strings or hashes
        window.location.replace("html/index.html" + window.location.search + window.location.hash);
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .loading-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: #007BFF;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        a {
            color: #007BFF;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="loading-box">
        <div class="spinner"></div>
        <p>Loading <a href="html/index.html">What New Songs</a>...</p>
    </div>
</body>
</html>
